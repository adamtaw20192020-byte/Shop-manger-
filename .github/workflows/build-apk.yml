name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Check Android Gradle settings
        run: |
          echo "===== android/gradle.properties ====="
          cat android/gradle.properties
          echo "===== android/gradle/wrapper/gradle-wrapper.properties ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/bird-shop-manager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bird-shop-manager-apk
          path: build/app/outputs/flutter-apk/bird-shop-manager.apk
          if-no-files-found: error
